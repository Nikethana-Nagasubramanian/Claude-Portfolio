<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent browser — visible context</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="patterns.css" />
  <link rel="stylesheet" href="agent-browser.css" />
</head>
<body>
  <main class="demo" aria-label="Agent browser prototype">
    <button class="replay" id="replay" type="button"><span aria-hidden="true">↻</span> Replay</button>

    <section class="conversation">
      <div class="user-block">
        <div class="prompt">Can you find nonstick Frying Pan Set 3 Piece either on Amazon or Target and make a comparison?</div>
        <time>12:37pm</time>
      </div>

      <div class="agent-block" aria-live="polite">
        <div class="status-line">
          <span class="agent-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="status-text" id="status">Thinking<span class="dots"><b>.</b><b>.</b><b>.</b></span></span>
        </div>
        <div class="tabs-viewport" aria-label="Pages the agent is using">
          <div class="tabs" id="tabs"></div>
        </div>
        <div class="answer" id="answer" hidden>
          <p><strong>Utopia Kitchen</strong> is the best value at $29.99, while <strong>GreenPan Rio</strong> has the more durable ceramic coating at $39.99.</p>
        </div>
      </div>
      <div class="composer" aria-label="Message composer">
        <span>Ask anything...</span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M15.7 1.4 11.6 14.9c-.1.3-.3.6-.5.8-.2.1-.5.2-.8.2-.2 0-.4-.1-.6-.2-.2-.1-.3-.3-.4-.5L6.7 10 2 7.7c-.3-.1-.5-.4-.6-.7-.1-.2-.1-.5 0-.8.1-.2.3-.4.6-.5L14.3.1c.3-.1.6-.1.9 0 .2.1.4.3.5.5.1.3.1.6 0 .8ZM7.6 8.4l3.5-3.5-5.7 3.1 2.2 1.1Zm3.1 4.1 3.1-10.1L8.5 7l2.2 4.5Z" fill="currentColor"/></svg>
      </div>
    </section>
  </main>
  <script src="agent-browser.js"></script>
</body>
</html>
